<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aprueba · Wireframe Web</title><style>
*{box-sizing:border-box}body{margin:0;background:#e5eaf1;color:#172e48;font:16px/1.5 system-ui,sans-serif}#app{max-width:1380px;min-height:100vh;margin:auto;background:#f7f9fc;display:grid;grid-template-columns:215px 1fr}aside,footer{background:#18334e;color:white;padding:24px 14px}aside b{font-size:25px;margin:0 10px}nav{display:grid;gap:4px;margin-top:24px}button,select,input{font:inherit;padding:9px 13px;border:1px solid #b7c6d4;background:white;color:inherit;border-radius:9px;cursor:pointer}button:hover,button:focus-visible{outline:2px solid #208476}button:disabled{opacity:.5;cursor:default}aside button,footer button{background:transparent;color:white;border:0;text-align:left}button.active{background:#315675;color:white}header{padding:12px 5%;background:white;border-bottom:1px solid #d9e3ee;display:flex;align-items:center;justify-content:space-between;gap:10px}main{padding:24px 5% 60px;max-width:1050px;margin:auto}h1{font-size:clamp(26px,4vw,38px);margin:0;color:white}h2{margin:0 0 12px;font-size:20px}p{margin:8px 0}section{background:white;border:1px solid #d8e3ef;border-radius:16px;padding:20px;margin-top:15px}article{background:linear-gradient(110deg,#154e56,#203959);color:white;border-radius:18px;padding:25px}article small{color:#c4ece4}label{display:block;margin:12px 0}input,select{max-width:100%}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.primary{background:#f6b33f;border-color:#f6b33f;color:#172e48;font-weight:650}progress{width:100%;accent-color:#16887b}.hint{font-size:13px;color:#51677b}.mobile #app{max-width:430px;display:block;box-shadow:0 0 30px #37516a25}.mobile aside,.web footer{display:none}.mobile footer{position:sticky;bottom:0;display:flex;justify-content:space-around;padding:8px 1px}.mobile footer button{padding:8px 4px;font-size:13px}.mobile header{position:sticky;top:0;z-index:1}.mobile main{min-height:76vh;padding:14px}.mobile article{padding:18px}@media(max-width:700px){.web #app{display:block}.web nav{display:flex;overflow:auto;margin:4px}.web aside{padding:8px}.web aside button{white-space:nowrap}}
</style><body class="web"><div id="app"><aside><b>Aprueba</b><nav id="nav"></nav></aside><div><header><strong>Aprueba</strong><small>Wireframe · Web</small><button data-go="Avisos">Campana</button></header><main id="main"></main></div><footer id="bar"></footer></div><script>
const names=['Arena','Plan de estudio','Inicio','Practicar','Medallas','Grupos','Tutores','Comunidad','Suscripción','Ajustes'],esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const B=(label,act,primary=false)=>'<button data-act="'+act+'" class="'+(primary?'primary':'')+'">'+label+'</button>',G=(label,dest=label)=>'<button data-go="'+dest+'">'+label+'</button>',card=(title,body,actions='')=>'<section><h2>'+title+'</h2>'+body+(actions?'<div class="actions">'+actions+'</div>':'')+'</section>',pick=(id,options,val)=>'<select id="'+id+'">'+options.map(v=>'<option '+(v==val?'selected':'')+'>'+v+'</option>').join('')+'</select>';
const tests=['Matemática M1','Matemática M2','Competencia Lectora','Ciencias','Historia'], qs=[['¿Cuánto es el 25 % de 80?','20','25','40'],['Si 3x = 18, ¿cuánto vale x?','3','6','9'],['¿Cuál es la media de 2, 4 y 6?','4','6','12'],['¿Cuánto es 2³?','6','8','9'],['¿Cuál es la mitad de ¾?','⅜','½','⅔']],keys=[0,1,0,1,0];
let view='Inicio',p=0,correct=0,ans=null,goal=10,subject=tests[0],bronze=5,silver=0,plan='Gratuito',renew=false,group=false,posts=[],read=false,stage='setup',n=3,r=0,score=0,arena='ready',round=0,points=0,rival=0,entry=false,subjectArena=tests[0],msg='';
function go(v){view=v;msg='';render();window.scrollTo(0,0)}
function qbox(i,act){return card(qs[i][0],'',qs[i].slice(1).map((x,j)=>B(x,act+j)).join(''))}
function render(){nav.innerHTML=names.map(x=>G(x)).join('');bar.innerHTML=['Inicio','Medallas','Practicar','Grupos','Más'].map(x=>G(x)).join('');document.querySelectorAll('[data-go]').forEach(x=>x.classList.toggle('active',x.dataset.go===view));let h='',desc='';
switch(view){
case 'Inicio':desc='Tu progreso de práctica';h=card('Tu objetivo de hoy',p+' / '+goal+' preguntas<progress value="'+Math.min(p,goal)+'" max="'+goal+'"></progress>',G('Ver mi plan','Plan de estudio')+G('Continuar practicando','Practicar'))+card('Avance de práctica',p+' respondidas · '+correct+' aciertos',G('Ver actividad','Actividad'))+card('Tus medallas',bronze+' de bronce · '+silver+' de plata',G('Ver medallas','Medallas'));break;
case 'Plan de estudio':h=card('Configura tu meta','<label>Prueba '+pick('sub',tests,subject)+'</label><label>Preguntas diarias <input id="goal" type="number" min="1" max="'+(plan==='Acceso completo'?100:10)+'" value="'+goal+'"></label>',B('Guardar plan','save',true))+card('Tu objetivo de hoy',p+' / '+goal+' · '+esc(subject),G('Practicar','Practicar'));break;
case 'Practicar':desc='Práctica general · Matemática M1';h=card('Formato de preguntas','Entrena a tu ritmo o inicia una serie en orden fijo.',G('Abrir facsímil','Facsímil'));if(ans===null&&p>=10&&plan!=='Acceso completo')h+=card('Cuota diaria alcanzada','Has usado tus 10 preguntas base. Colegio y edad suman 5. Región, comuna y calle con número suman otras 5.',G('Ver planes','Suscripción'));else if(ans===null)h+=qbox(p%5,'practice');else h+=card(ans?'Respuesta correcta':'Revisa tu respuesta','Alternativa correcta: '+qs[(p-1)%5][1+keys[(p-1)%5]],B('Siguiente pregunta','next',true)+G('Compartir al grupo','Grupos'));break;
case 'Actividad':h=card('Últimas respuestas',p?p+' respuestas guardadas · '+correct+' correctas':'Todavía no has respondido preguntas.',G('Practicar'));break;
case 'Facsímil':if(plan!=='Acceso completo')h=card('Incluido en Acceso completo','Selecciona la prueba, dificultad y cantidad de preguntas en orden fijo.',G('Ver suscripción','Suscripción'));else if(stage==='setup')h=card('Configura el ensayo','Matemática M1 · Intermedia<label>Cantidad '+pick('count',[1,2,3,4,5],n)+'</label>',B('Comenzar','startF',true));else if(stage==='run')h=card('Pregunta '+(r+1)+' de '+n,'Matemática M1')+qbox(r,'fac');else h=card('Resultado',score+' aciertos de '+n+' · '+Math.round(100*score/n)+' %',B('Nuevo facsímil','resetF'));break;
case 'Arena':if(arena==='ready')h=card('Duelo 1 contra 1','<label>Prueba '+pick('arenaSub',tests,subjectArena)+'</label>5 rondas · 60 segundos por ronda · Entrada: 1 bronce · Pozo: 2',B('Buscar rival','search',true));if(arena==='queue')h=card('Buscando rival',subjectArena+' · Esperando otro estudiante.',B('Mostrar rival de ejemplo','found',true)+B('Cancelar búsqueda','cancel'));if(arena==='found')h=card('Rival encontrado','Ambos jugadores deben aceptar para iniciar.',B('Aceptar duelo','accept',true)+B('Declinar','cancel'));if(arena==='run')h=card('Ronda '+(round+1)+' de 5',subjectArena+' · Tú '+points+' / Rival '+rival)+qbox(round,'duel');if(arena==='end')h=card(points>rival?'Victoria':points===rival?'Empate':'Derrota','Marcador '+points+' – '+rival+' · Saldo: '+bronze+' bronces',B('Volver a Arena','cancel')+G('Ver medallas','Medallas'));break;
case 'Suscripción':h=card('Tu plan',plan+(plan==='Acceso completo'?(renew?' · Renovación mensual':' · Acceso hasta el vencimiento'):' · 10 preguntas diarias'))+card('Acceso completo','$4.990 CLP / mes · Todas las pruebas, facsímil y tutores.',plan==='Acceso completo'?(renew?B('Cancelar renovación','stop'):''):G('Continuar con PayPal','Pago'))+card('Una prueba ilimitada','$990 CLP / mes · Una asignatura a elección.');break;
case 'Pago':h=card('Aprobación del comprador','Retorno de PayPal Sandbox representado con una operación local de ejemplo.',G('Aprobar y volver','Verificación de pago')+G('Cancelar','Suscripción'));break;
case 'Verificación de pago':h=card('Comprobar estado','La aplicación confirma la operación con el servidor antes de habilitar el plan.',B('Comprobar pago','paid',true));break;
case 'Medallas':h=card('Saldo disponible',bronze+' bronces · '+silver+' platas',B('Canjear 5 bronces por 1 plata','exchange'))+card('Historial','Las respuestas correctas, canjes y duelos modifican tu saldo en este recorrido.');break;
case 'Grupos':h=card('Mis grupos',group?'Estudio M1 · Integrante':'Aún no perteneces a un grupo.',group?B('Salir del grupo','leave'):'')+card('Descubrir grupos públicos','Estudio M1 · Matemática',group?'':B('Unirme','join',true));break;
case 'Comunidad':h=card('Compartir una pregunta','<label>Mensaje <input id="post" maxlength="300"></label>',B('Publicar','post',true))+posts.map(x=>card('Estudiante de ejemplo',esc(x))).join('')+card('Grupo de estudio','¿Cómo repasan porcentajes antes de la prueba?');break;
case 'Tutores':h=card('Análisis de debilidades','Revisa las materias que conviene reforzar.',G('Generar mi análisis',plan==='Acceso completo'?'Análisis':'Suscripción'))+card('María Valdés','Matemática M1 · Álgebra y funciones',G('Ver perfil','Perfil del tutor'));break;
case 'Perfil del tutor':h=card('María Valdés','Matemática M1 y M2 · Álgebra y funciones · $12.000 por hora',plan==='Acceso completo'?B('Solicitar contacto','contact'):G('Ver plan','Suscripción'));break;
case 'Análisis':h=card('Matemática M1',p?'Historial de esta sesión: '+correct+' aciertos en '+p+' respuestas.':'Responde preguntas para generar recomendaciones.',G('Practicar'));break;
case 'Avisos':h=card('Medalla de bienvenida','+1 bronce · '+(read?'Leída':'Sin leer'),read?'':B('Marcar como leída','read'));break;
case 'Ajustes':h=card('Cuenta','Estudiante de ejemplo · Correo verificado',G('Ver suscripción','Suscripción'))+card('Preferencias de práctica',esc(subject),G('Editar plan','Plan de estudio'))+card('Actividad y progreso','Consulta tus respuestas de práctica.',G('Ver actividad','Actividad'));break;
default:h=card('Explorar Aprueba','',names.concat(['Facsímil','Actividad','Avisos']).map(x=>G(x)).join(''))}
main.innerHTML='<article><small>Aprueba PAES</small><h1>'+esc(view)+'</h1>'+esc(desc)+'</article>'+h+'<p role="status">'+esc(msg)+'</p><p class="hint">Prototipo interactivo · Datos de ejemplo · Base 9473b68 / Android 1.3.6. Recarga para reiniciar.</p>'}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.go){go(t.dataset.go);return}const a=t.dataset.act;msg='';if(a==='save'){const g=document.querySelector('#goal');if(!g.value||!g.reportValidity())return;goal=Number(g.value);subject=document.querySelector('#sub').value;msg='Plan guardado.'}
if(a.startsWith('practice')&&ans===null){ans=+a.slice(8)===keys[p%5];p++;if(ans){correct++;bronze++}}if(a==='next')ans=null;
if(a==='paid'){plan='Acceso completo';renew=true;go('Suscripción');return}if(a==='stop'){renew=false;msg='Renovación cancelada. Conservas el período pagado.'}
if(a==='startF'){n=Number(document.querySelector('#count').value);r=score=0;stage='run'}if(a.startsWith('fac')){if(+a.slice(3)===keys[r])score++;if(++r===n)stage='end'}if(a==='resetF')stage='setup';
if(a==='search'){if(bronze<1)msg='Necesitas un bronce para entrar.';else{subjectArena=document.querySelector('#arenaSub').value;arena='queue'}}if(a==='found')arena='found';if(a==='accept'){if(!bronze){arena='ready';msg='Saldo insuficiente.'}else{bronze--;arena='run';round=points=rival=0}}if(a==='cancel')arena='ready';if(a.startsWith('duel')){if(+a.slice(4)===keys[round])points++;if(round%2===0)rival++;if(++round===5){arena='end';bronze+=points>rival?2:points===rival?1:0}}
if(a==='exchange'){if(bronze>=5){silver++;bronze-=5}else msg='Necesitas 5 bronces.'}if(a==='join')group=true;if(a==='leave')group=false;if(a==='post'){const v=document.querySelector('#post').value.trim();if(v)posts.unshift(v);else msg='Escribe un mensaje.'}if(a==='contact')msg='Solicitud de ejemplo registrada.';if(a==='read')read=true;render()});render();
</script></body></html>
