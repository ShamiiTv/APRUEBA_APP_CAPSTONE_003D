const LOGO=`<svg width="26" height="26" viewBox="0 0 30 30" fill="none"><polygon points="3,27 9,6 13,6 8,27" fill="#1A365D"/><polygon points="27,27 21,6 17,6 22,27" fill="#1A365D"/><rect x="7" y="14" width="16" height="4" rx="1" fill="#1A365D"/><rect x="12" y="14" width="6" height="10" rx="1" fill="#F5B041"/><polygon points="15,5 12,10 18,10" fill="#F5B041"/></svg>`;

function coin(type,size){
  const lbl={bronze:'🥉',silver:'🥈',gold:'🥇',diamond:'💎',platinum:'⬡'};
  const cls={'sm':'medal-sm','md':'medal-md','lg':'medal-lg'}[size]||'medal-sm';
  return `<span class="medal-coin ${type} ${cls}">${lbl[type]||'🏅'}</span>`;
}
function stars(n,sz){const s=sz||13;let h='';for(let i=1;i<=5;i++){h+=`<span style="color:${i<=Math.round(n)?'#F5B041':'var(--line)'};font-size:${s}px;line-height:1">★</span>`;}return `<span style="letter-spacing:1px;white-space:nowrap">${h}</span>`;}
function starPick(){let h='<span style="white-space:nowrap">';for(let i=1;i<=5;i++){h+=`<span onclick="[...this.parentNode.children].forEach((s,j)=>s.style.color=j<=${i-1}?'#F5B041':'var(--line)')" style="font-size:28px;cursor:pointer;color:var(--line);padding:0 3px">★</span>`;}return h+'</span>';}
function tabbar(){
  const es=APP.lang==='es';
  const tabs=[['home','🏠',L('today')],['medals','🏅',L('med_tab')],['groups','👥',L('grp_tab')],['tutors','🎓',es?'Tutores':'Tutors'],['feed','💬',es?'Red':'Feed'],['settings','⚙️',es?'Ajustes':'Settings']];
  return `<div class="tabbar">${tabs.map(t=>`<div class="${t[0]===APP.currentTab?'act':''}" onclick="gotoTab('${t[0]}')"><span class="i">${t[1]}</span>${t[2]}</div>`).join('')}</div>`;
}
function topnav(title,back=true){
  return `<div class="topnav">${back?`<button class="back-btn" onclick="nav_back()">←</button>`:''}<div class="nav-title">${title}</div></div>`;
}

// ── NAVIGATION ──
function navigate(id,params){
  if(APP.current)APP.history.push(APP.current);
  APP.current=id;APP.params=params||{};render();
}
function nav_back(){
  const prev=APP.history.pop();
  if(prev){APP.current=prev;APP.params={};render();}
}
function gotoTab(tab){
  APP.currentTab=tab;APP.history=[];
  navigate(tab);
}
function showToast(msg,type,icon){
  const t=document.getElementById('toast');
  const cols={bronze:'var(--bronze)',silver:'var(--silver)',gold:'var(--gold)',diamond:'var(--diamond)',platinum:'var(--platinum)'};
  t.style.background=cols[type]||'var(--bronze)';
  t.style.color=(type==='gold')?'#1A365D':'#fff';
  document.getElementById('toastMsg').textContent=msg;
  document.getElementById('toastIcon').textContent=icon||'🥉';
  t.className='toast';
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>t.classList.remove('show'),2800);
}
function earnMedal(type,count=1){
  APP.medals[type]=(APP.medals[type]||0)+count;
  const icons={bronze:'🥉',silver:'🥈',gold:'🥇',diamond:'💎',platinum:'⬡'};
  const names={bronze:L('med_bronze'),silver:L('med_silver'),gold:L('med_gold'),diamond:L('med_diamond'),platinum:L('med_platinum')};
  showToast(`+${count} ${names[type]}`,type,icons[type]);
}

function getAvailableTests(){
  const school=APP.gradeId&&!APP.gradeId.includes('paes')&&!APP.gradeId.includes('gcse')&&!APP.gradeId.includes('a-levels');

    ? [{id:'eng',es:'English',en:'English',color:'#1A365D'},{id:'maths',es:'Maths',en:'Maths',color:'#10B981'},{id:'science',es:'Science',en:'Science',color:'#6366F1'},{id:'history',es:'History',en:'History',color:'#F5B041'}]

  <p class="p">${es?t.name+' recibirá tu perfil para conocer tus necesidades antes de responder.':t.name+' will receive your profile to understand your needs before replying.'}</p>
  <div class="h" style="font-size:13px">${es?'Tu perfil (se compartirá)':'Your profile (will be shared)'}</div>
  <div class="card"><div class="flex" style="gap:10px"><div class="avatar" style="background:#F5B041;color:#1A365D;width:40px;height:40px;font-size:13px;display:grid;place-items:center;border-radius:50%;font-weight:700">${(APP.userName||'MX').slice(0,2).toUpperCase()}</div><div><b style="font-size:13px">${APP.userName||'Max'} · ${es?'4º Medio':'12th grade'}</b><div class="small">${es?'Objetivo: 700+ pts · Rinde PAES nov. 2026':'Goal: 700+ pts · PAES Nov 2026'}</div></div></div>
    <div class="small" style="margin-top:9px">${es?'Áreas débiles (de tu análisis)':'Weak areas (from your analysis)'}:</div>
    <div style="margin-top:5px">${(es?['Álgebra','Funciones']:['Algebra','Functions']).map(w=>`<span class="tag d" style="margin-right:5px;display:inline-block">⚠ ${w}</span>`).join('')}</div>
  </div>
  <div class="h" style="font-size:13px">${es?'Mensaje':'Message'}</div>
  <textarea placeholder="${es?'Hola '+t.name+', necesito reforzar álgebra para la PAES. ¿Tienes cupos en las tardes?':'Hi '+t.name+', I need to reinforce algebra for the PAES. Any afternoon slots?'}" style="width:100%;min-height:80px;resize:none"></textarea>
  <p class="note">💳 ${es?'El pago de clases se acuerda directamente con el profesor (pronto integrado en Aprueba).':'Lesson payment is arranged directly with the tutor (coming soon in Aprueba).'}</p>
  <div class="spacer"></div>
  <button class="btn" onclick="tutSendRequest(${APP.params.t||0})">${es?'Enviar solicitud':'Send request'}</button>
</div>`;});

// 6 · CHAT INTERNO (+ compartir contacto)
reg('tutor-chat',()=>{const es=APP.lang==='es';const t=curT();
  const msgs=[
    {me:false,x:es?'¡Hola '+(APP.userName||'Max')+'! Vi tu perfil, podemos partir reforzando álgebra. Tengo cupo martes y jueves 18:00.':'Hi '+(APP.userName||'Max')+'! Saw your profile, we can start with algebra. I have Tue & Thu 6pm slots.'},
    {me:true,x:es?'Perfecto, me sirve el martes. ¿Es online?':'Great, Tuesday works. Is it online?'},
    {me:false,x:es?'Sí, por videollamada. La primera clase es de diagnóstico 👍':'Yes, by video call. First class is a diagnosis 👍'},
  ];
  return `<div class="si">
  <div class="topnav"><button class="back-btn" onclick="nav_back()">←</button><div class="avatar" style="background:${t.c};color:${t.tc};width:30px;height:30px;font-size:11px;display:grid;place-items:center;border-radius:50%;font-weight:700;margin-right:8px">${t.ini}</div><div class="nav-title" style="flex:1">${t.name}<div class="small" style="font-size:10px;color:var(--accent);font-weight:600">● ${es?'En línea':'Online'}</div></div></div>
  <div class="card" style="padding:10px;background:var(--gold-bg);border-color:var(--oro)"><div class="flex between"><span class="small" style="font-weight:600;color:var(--ink)">🔒 ${es?'Compartir mi WhatsApp':'Share my WhatsApp'}</span><span class="sw on" onclick="this.classList.toggle('on')"></span></div><p class="note" style="margin-top:4px">${es?'Se revela solo si ambos aceptan. Recomendamos coordinar aquí primero.':'Revealed only if both agree. We suggest coordinating here first.'}</p></div>
  <div style="flex:1;margin-top:10px;display:flex;flex-direction:column;gap:8px">${msgs.map(m=>`<div style="max-width:80%;align-self:${m.me?'flex-end':'flex-start'};background:${m.me?'var(--brand)':'var(--soft)'};color:${m.me?'#fff':'var(--ink)'};border:1.5px solid ${m.me?'var(--brand)':'var(--line)'};border-radius:14px;padding:9px 12px;font-size:12px;line-height:1.4">${m.x}</div>`).join('')}</div>
  <button class="btn sec" onclick="navigate('tutor-review',{t:${APP.params.t||0}})">⭐ ${es?'Calificar a '+t.name:'Rate '+t.name}</button>
  <div class="flex" style="gap:8px;margin-top:8px"><input type="text" placeholder="${es?'Escribe un mensaje…':'Type a message…'}" style="flex:1;margin:0"><button class="btn" style="width:auto;margin:0;padding:11px 16px">➤</button></div>
</div>`;});

// 7 · DEJAR RESEÑA (1–5 ⭐ · 3 criterios)
reg('tutor-review',()=>{const es=APP.lang==='es';const t=curT();const cn=TUT_CRIT();
  return `<div class="si">
  ${topnav(es?'Calificar profesor':'Rate tutor')}
  <div class="flex" style="gap:10px"><div class="avatar" style="background:${t.c};color:${t.tc};width:40px;height:40px;font-size:13px;display:grid;place-items:center;border-radius:50%;font-weight:700">${t.ini}</div><div><b style="font-size:13px">${t.name}</b><div class="small">${es?'8 clases tomadas · '+t.subj:'8 classes taken · '+t.subjEn}</div></div></div>
  <p class="p" style="margin-top:8px">${es?'Califica de 1 a 5 estrellas cada criterio:':'Rate each criterion from 1 to 5 stars:'}</p>
  ${cn.map(c=>`<div class="card" style="padding:12px"><div style="font-size:13px;font-weight:700;font-family:'Montserrat',sans-serif;margin-bottom:6px">${c}</div>${starPick()}</div>`).join('')}
  <div class="h" style="font-size:13px">${es?'Comentario (opcional)':'Comment (optional)'}</div>
  <textarea placeholder="${es?'Cuenta tu experiencia para ayudar a otros alumnos…':'Share your experience to help other students…'}" style="width:100%;min-height:72px;resize:none"></textarea>
  <div class="spacer"></div>
  <button class="btn" onclick="tutPublishReview(${APP.params.t||0})">${es?'Publicar reseña':'Publish review'}</button>
</div>`;});

// ── ACTIONS ──
function tutSendRequest(t){showToast(APP.lang==='es'?'Solicitud enviada ✓':'Request sent ✓','gold','📨');setTimeout(()=>navigate('tutor-chat',{t}),700);}
function tutPublishReview(t){showToast(APP.lang==='es'?'¡Reseña publicada! +2 🥉':'Review published! +2 🥉','bronze','⭐');APP.medals.bronze=(APP.medals.bronze||0)+2;setTimeout(()=>navigate('tutor-profile',{t}),700);}
function demoLogin(){APP.loggedIn=true;APP.userName='Demo';earnMedal('bronze',1);navigate('home');}
function doRegister(){
  const n=document.getElementById('inp_name');
  APP.loggedIn=true;APP.userName=(n&&n.value.trim())||'Estudiante';
  earnMedal('bronze',1);navigate('select-tests');
}
function sendSmsCode(){
  const input=document.getElementById('inp_phone');
  const value=(input&&input.value.trim())||'';
  const compact=value.replace(/[\s()-]/g,'');
  if(!compact.startsWith('+')||compact.length<9){alert(tr('Ingresa un numero con codigo de pais.','Enter a number including the country code.'));return;}
  APP.phone=value;
  APP.country=compact.startsWith('+44')?'UK':'CL';
  APP.language=APP.country==='UK'?'en':'es';
  APP.lang=APP.language;
  document.getElementById('langSel').value=APP.lang;
  navigate('sms-verification');
}
function confirmSmsCode(){
  const input=document.getElementById('inp_sms');
  const code=(input&&input.value.trim())||'';
  if(code!=='123456'){alert(tr('Ingresa el codigo de 6 digitos.','Enter the 6-digit code.'));return;}
  navigate('confirm-locale');
}
function setOnboardingCountry(country){
  APP.country=country;
  APP.language=country==='UK'?'en':'es';
  APP.lang=APP.language;
  document.getElementById('langSel').value=APP.lang;
  render();
}
function setOnboardingLanguage(language){
  APP.language=language;
  APP.lang=language;
  document.getElementById('langSel').value=APP.lang;
  render();
}
function confirmLocale(){
  APP.lang=APP.language;
  APP.gradeId=null;APP.gradeLabel='';APP.selectedTests=[];
  document.documentElement.lang=APP.lang;
  document.getElementById('langSel').value=APP.lang;
  navigate('select-grade');
}
function selectGrade(id){APP.gradeId=id;APP.gradeLabel=gradeName();render();}
function continueFromGrade(){
  if(!APP.gradeId)return;
  APP.gradeLabel=gradeName();APP.selectedTests=[];
  navigate('select-tests');
}
function doRegister(){
  const n=document.getElementById('inp_name');
  const email=document.getElementById('inp_email');
  if(!n||!n.value.trim()||!email||!email.value.includes('@')){alert(tr('Completa tu nombre y correo.','Enter your name and email.'));return;}
  APP.loggedIn=true;APP.userName=n.value.trim();
  earnMedal('bronze',1);navigate('format');
}
function startApp(){earnMedal('bronze',1);navigate('home');}
function toggleTest(id,el){const i=APP.selectedTests.indexOf(id);if(i>=0)APP.selectedTests.splice(i,1);else APP.selectedTests.push(id);el.classList.toggle('on');}
function selectOpt(i){
  document.querySelectorAll('.opt').forEach((o,j)=>{o.className='opt'+(j===i?' sel':'');});
  APP.selectedOpt=i;
}
function checkAnswer(){
  if(APP.selectedOpt===null)return;
  const q=APP.currentQ;
  APP.quotaUsed=Math.min(APP.quotaUsed+1,APP.quotaMax);
  if(APP.selectedOpt===q.correct)earnMedal('bronze',1);
  navigate('result');
  if(APP.quotaUsed>=APP.quotaMax&&APP.quotaMax===10)setTimeout(()=>navigate('limit-2'),1500);
  else if(APP.quotaUsed>=APP.quotaMax&&APP.quotaMax>=20)setTimeout(()=>navigate('paywall'),1500);
}
function goCheckout(pid){APP.checkoutPlan=pid;navigate('checkout');}
function payPlan(){
  APP.plan=APP.checkoutPlan;APP.planCancelled=false;
  APP.quotaMax=9999;APP.quotaUsed=0; // plan activo: sin límite
  showToast(APP.lang==='es'?'Plan activado ✓':'Plan activated ✓','gold','🎉');
  navigate('payment-success');
}
function cancelPlan(){APP.planCancelled=true;render();}
function submitRc(){APP.rcSubmitted=true;render();}
function simulateRcConfirm(){
  APP.rcRewarded=true;APP.rcSubmitted=false;
  APP.medals.bronze=(APP.medals.bronze||0)+250;
  showToast((APP.lang==='es'?'+250 Medallas de Bronce!':'+250 Bronze Medals!'),'bronze','🥉');
  render();
}
function doExchange(from,to){
  if((APP.medals[from]||0)<5)return;
  APP.medals[from]=(APP.medals[from]||0)-5;
  if(to)APP.medals[to]=(APP.medals[to]||0)+1;
  earnMedal(to||'platinum',1);
  setTimeout(()=>render(),400);
}
function gDec(fi){const q=document.getElementById('gq'+fi);if(q&&+q.textContent>0)q.textContent=+q.textContent-1;}
function gInc(fi){
  const q=document.getElementById('gq'+fi);if(!q)return;
  let s=0;document.querySelectorAll('[id^="gq"]').forEach(e=>s+=+e.textContent);
  const rem=APP.dailyGiftsMax-APP.dailyGiftsUsed;
  if(s<rem)q.textContent=+q.textContent+1;
}
function sendGift(fi){
  const q=document.getElementById('gq'+fi);const amt=q?+q.textContent:0;
  if(amt>0){
    APP.dailyGiftsUsed=Math.min(APP.dailyGiftsUsed+amt,APP.dailyGiftsMax);
    APP.medals.bronze=Math.max(0,(APP.medals.bronze||0)-amt);
    const s=document.getElementById('gs'+fi);
    if(s)s.textContent=(APP.lang==='es'?'Regaladas: ':'Gifted: ')+amt+' 🥉';
    if(q)q.textContent='0';
  }
}
function sendAllGifts(){document.querySelectorAll('[id^="gq"]').forEach((_,fi)=>sendGift(fi));}
function createGroup(){
  const name=document.getElementById('newGrpName');
  const gName=name?name.value.trim():'';
  if(!gName){alert(APP.lang==='es'?'Ingresa un nombre para el grupo':'Enter a group name');return;}
  const chips=document.querySelectorAll('.chip.on');
  let subj=allTests[0].label;
  chips.forEach(c=>{const t=allTests.find(t=>c.textContent.includes(t.label));if(t)subj=t.label;});
  APP.groups.push({id:'g'+Date.now(),name:gName,subject:subj,color:['#1A365D','#10B981','#6366F1','#EF4444','#F5B041'][APP.groups.length%5],members:[{i:'YO',n:APP.userName||'Tú',c:'#F5B041',tc:'#1A365D'}],avg:0,your:0});
  navigate('invite-members',{gi:APP.groups.length-1});
}
function sendInvite(gi){
  const inp=document.getElementById('invEmail');
  const email=inp?inp.value.trim():'';
  if(!email||!email.includes('@')){alert(APP.lang==='es'?'Ingresa un correo válido':'Enter a valid email');return;}
  APP.invites.push({gi,email});if(inp)inp.value='';render();
}
function shareToGroup(){
  showToast(APP.lang==='es'?'Pregunta compartida en el grupo':'Question shared to group','bronze','👥');
  setTimeout(()=>navigate('group-detail',{gi:0}),800);
}
function toggleTheme(){APP.dark=!APP.dark;document.body.classList.toggle('dark',APP.dark);document.getElementById('themeBtn').textContent=APP.dark?'☀️':'🌙';}
function setLang(l){APP.lang=l;document.getElementById('langSel').value=l;document.documentElement.lang=l;render();}

// ── RENDER ──
function render(){
  const fn=SCREENS[APP.current];
  document.getElementById('screen').innerHTML=fn?fn():`<div class="si" style="text-align:center;padding-top:60px"><div style="font-size:40px">⚠️</div><div class="h">Screen not found: ${APP.current}</div><button class="btn" onclick="navigate('splash')">← Back</button></div>`;
}
navigate('splash');
</script>
</body>
</html>
