<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
/* ── Manual de Marca ── */
:root{
  --azul:#1A365D;--oro:#F5B041;--fondo:#F8FAFC;--texto:#1E293B;--exito:#10B981;--error:#EF4444;
  --bg:var(--fondo);--panel:#ffffff;--ink:var(--texto);--muted:#64748B;--line:#E2E8F0;--soft:#F1F5F9;
  --brand:var(--azul);--cta:var(--oro);--cta-ink:var(--azul);--accent:var(--exito);--warn:var(--oro);--danger:var(--error);
  --chip:#EEF4FF;--shadow:0 8px 24px rgba(26,54,93,.08);
  --side:#1A365D;--side-ink:#E8EEF7;--side-mut:rgba(232,238,247,.6);--side-act:rgba(255,255,255,.12);
  --bronze:#CD7F32;--silver:#94A3B8;--gold:#F5B041;--diamond:#38BDF8;--platinum:#A78BFA;
}
.dark{
  --bg:#0B1220;--panel:#131C2E;--ink:#E2E8F0;--muted:#94A3B8;--line:#1E2D45;--soft:#1A2540;
  --brand:#2D5A9E;--cta:#F5B041;--cta-ink:#1A365D;--accent:#34D399;--danger:#F87171;--chip:#1A2C4A;
  --shadow:0 8px 24px rgba(0,0,0,.5);
  --side:#0C1626;--side-ink:#E2E8F0;--side-mut:rgba(226,232,240,.55);--side-act:rgba(255,255,255,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:'Inter',system-ui,sans-serif;color:var(--ink);font-size:14px;line-height:1.5;transition:background .25s}
h1,h2,h3,.h,.logo,.price,.brandfont{font-family:'Montserrat',sans-serif}

/* ── App shell ── */
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;transition:transform .25s}
.side-logo{display:flex;align-items:center;gap:9px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:19px;padding:20px 18px 16px}
.side-logo svg{flex-shrink:0}
.nav{flex:1;padding:6px 12px;overflow-y:auto}
.nav-sec{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--side-mut);font-weight:700;padding:14px 10px 6px;font-family:'Montserrat',sans-serif}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--side-ink);cursor:pointer;margin-bottom:2px;border-left:3px solid transparent;transition:background .15s}
.nav-item:hover{background:var(--side-act)}
.nav-item.act{background:var(--side-act);border-left-color:var(--cta)}
.nav-item .ico{font-size:17px;width:20px;text-align:center;flex-shrink:0}
.nav-item .badge{margin-left:auto;font-size:9px;font-weight:800;background:var(--cta);color:#1A365D;border-radius:6px;padding:2px 6px;font-family:'Montserrat',sans-serif}
.side-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.side-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer}
.side-user:hover{background:var(--side-act)}
.side-avatar{width:34px;height:34px;border-radius:50%;background:var(--cta);color:#1A365D;display:grid;place-items:center;font-weight:800;font-family:'Montserrat',sans-serif;flex-shrink:0}
.side-user .nm{font-size:13px;font-weight:700}
.side-user .pl{font-size:11px;color:var(--side-mut)}

.main-wrap{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hamb{display:none;background:var(--soft);border:1px solid var(--line);color:var(--ink);width:38px;height:38px;border-radius:9px;font-size:18px;cursor:pointer}
.page-title{font-family:'Montserrat',sans-serif;font-weight:800;font-size:18px;color:var(--ink)}
.search{flex:1;max-width:340px;position:relative}
.search input{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 34px;font-size:13px;color:var(--ink);font-family:'Inter',sans-serif;outline:none}
.search::before{content:"🔍";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.6}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;font-family:'Inter',sans-serif}
.ctl{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 10px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif}
.content{padding:24px;max-width:1180px;width:100%}

/* ── Generic ── */
.h{font-size:18px;font-weight:700;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px}
.p{color:var(--muted);font-size:13px;margin:4px 0}
.note{font-size:11.5px;color:var(--muted);line-height:1.5}
.section-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);margin:22px 0 8px;font-family:'Montserrat',sans-serif}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--soft)}
.flex{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.divider{height:1px;background:var(--line);margin:14px 0}
.tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--chip);color:var(--muted)}
.tag.g{background:rgba(16,185,129,.13);color:#059669}
.tag.w{background:rgba(245,176,65,.18);color:#B45309}
.bar{height:9px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:6px;transition:width .4s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--cta);color:var(--cta-ink);border:none;border-radius:11px;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Montserrat',sans-serif;transition:opacity .15s,transform .1s}
.btn:hover{opacity:.92}.btn:active{transform:scale(.98)}
.btn.full{width:100%}
.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.pri{background:var(--brand);color:#fff}
.btn.gho{background:transparent;color:var(--brand);border:none}
input,textarea,select{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:13px;color:var(--ink);font-family:'Inter',sans-serif;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--brand)}
textarea{resize:none;min-height:74px}

/* ── Dashboard grid ── */
.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.span2{grid-column:span 2}.span3{grid-column:span 3}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .big{font-size:30px;font-weight:800;font-family:'Montserrat',sans-serif;color:var(--brand)}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:600}
.medal-coin{display:inline-grid;place-items:center;border-radius:50%;font-weight:800;font-family:'Montserrat',sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.bronze{background:var(--bronze);color:#fff}.silver{background:var(--silver);color:#fff}.gold{background:var(--gold);color:#1A365D}.diamond{background:var(--diamond);color:#fff}.platinum{background:var(--platinum);color:#fff}
.m-sm{width:30px;height:30px;font-size:14px}.m-md{width:42px;height:42px;font-size:19px}.m-lg{width:58px;height:58px;font-size:27px}
.upgrade{background:linear-gradient(135deg,var(--brand),#264b80);color:#fff;border:none}
.upgrade .h{color:#fff}.upgrade .note{color:rgba(255,255,255,.8)}

/* ── Practice ── */
.opt{border:1.5px solid var(--line);border-radius:12px;padding:14px;font-size:14px;margin-top:10px;cursor:pointer;display:flex;gap:11px;align-items:center;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--brand)}
.opt .k{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0;font-family:'Montserrat',sans-serif}
.opt.sel{border-color:var(--brand);background:rgba(26,54,93,.06)}.opt.sel .k{background:var(--brand);color:#fff;border-color:var(--brand)}
.opt.ok{border-color:var(--accent);background:rgba(16,185,129,.08)}.opt.ok .k{background:var(--accent);color:#fff;border-color:var(--accent)}
.opt.no{border-color:var(--danger);background:rgba(239,68,68,.06)}.opt.no .k{background:var(--danger);color:#fff;border-color:var(--danger)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-family:'Montserrat',sans-serif}

/* ── Misc rows ── */
.row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:10px;background:var(--panel)}
.group-card{cursor:pointer;transition:border-color .15s}.group-card:hover{border-color:var(--brand)}
.avatar-sq{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-family:'Montserrat',sans-serif;flex-shrink:0}
.mstack{display:flex}.mavatar{width:30px;height:30px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;font-family:'Montserrat',sans-serif;border:2px solid var(--panel);margin-left:-8px}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg div{padding:8px 16px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);font-family:'Montserrat',sans-serif}
.seg div.on{background:var(--brand);color:#fff}
.paybtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:11px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;border:none;font-family:'Inter',sans-serif;margin-top:10px}
.paybtn.apple{background:#000;color:#fff}.paybtn.google{background:#fff;color:#3c4043;border:1px solid var(--line)}
.or-sep{display:flex;align-items:center;gap:10px;margin:16px 0 6px;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase}
.or-sep::before,.or-sep::after{content:"";flex:1;height:1px;background:var(--line)}
.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.skill-node{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:10px;margin-top:7px;font-size:13px}
.skill-node.done{background:rgba(16,185,129,.09);border:1px solid rgba(16,185,129,.22)}
.skill-node.active{background:rgba(26,54,93,.07);border:1.5px solid var(--brand)}
.skill-node.locked{background:var(--soft);border:1px solid var(--line);opacity:.55}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}

/* ── Responsive ── */
@media(max-width:1040px){.dash{grid-template-columns:repeat(2,1fr)}.span3{grid-column:span 2}.plan-grid{grid-template-columns:1fr}}
@media(max-width:860px){
  .sidebar{position:fixed;z-index:30;transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.3)}
  .sidebar.open{transform:translateX(0)}
  .hamb{display:grid;place-items:center}
  .scrim.open{display:block}
  .search{display:none}
}
@media(max-width:620px){.dash{grid-template-columns:1fr}.span2,.span3{grid-column:span 1}.content{padding:16px}.topbar{padding:10px 14px}}
</style>
</head>

function coin(t,s){const e={bronze:'🥉',silver:'🥈',gold:'🥇',diamond:'💎',platinum:'⬡'};const c={sm:'m-sm',md:'m-md',lg:'m-lg'}[s]||'m-sm';return `<span class="medal-coin ${t} ${c}">${e[t]||'🏅'}</span>`;}
function stars(n,sz){const s=sz||14;let h='';for(let i=1;i<=5;i++){h+=`<span style="color:${i<=Math.round(n)?'#F5B041':'var(--line)'};font-size:${s}px;line-height:1">★</span>`;}return `<span style="letter-spacing:1px;white-space:nowrap">${h}</span>`;}
function starPick(){let h='<span style="white-space:nowrap">';for(let i=1;i<=5;i++){h+=`<span onclick="[...this.parentNode.children].forEach((s,j)=>s.style.color=j<=${i-1}?'#F5B041':'var(--line)')" style="font-size:30px;cursor:pointer;color:var(--line);padding:0 4px">★</span>`;}return h+'</span>';}

V.plan=()=>{
  // active plan management
  if(APP.plan!=='free'&&APP.planStep!=='checkout'&&APP.planStep!=='success'){
    const pid=APP.plan;
    return `<div style="max-width:640px"><div class="h">${L('plan_h')}</div>
      <div class="card" style="margin-top:12px"><div class="flex between"><b>${L('plan_current')}</b><span class="tag g">${L(PLANS[pid].nameKey)}</span></div>
        <div class="divider"></div>
        <div class="flex between"><span class="note">${L('co_cycle')}</span><span class="note">${APP.billing==='yr'?L('bill_yr'):L('bill_mo')} · ${priceStr(pid,APP.billing)}</span></div>
        <div class="flex between" style="margin-top:8px"><span class="note">${L('mng_next')}</span><span class="note">${APP.billing==='yr'?'04/06/2027':'04/07/2026'}</span></div>
        <div class="flex between" style="margin-top:8px"><span class="note">${L('mng_method')}</span><span class="note">💳 •••• 4242</span></div></div>
      ${APP.planCancelled?`<div class="card flat" style="margin-top:12px;border-color:var(--oro)"><p class="note" style="margin:0;color:#B45309">⏳ ${L('mng_cancelled')}</p></div>`:''}
      <div class="flex" style="gap:10px;margin-top:14px"><button class="btn sec" onclick="APP.planStep='overview';APP.plan='free';render()">${L('mng_change')}</button>
      ${APP.planCancelled?'':`<button class="btn gho" style="color:var(--danger)" onclick="APP.planCancelled=true;render()">${L('mng_cancel')}</button>`}</div>
    </div>`;
  }
  if(APP.planStep==='success'){
    const pid=APP.plan;
    return `<div style="max-width:520px;margin:30px auto;text-align:center"><div style="font-size:60px">🎉</div>
      <div class="h" style="color:var(--accent)">${L('pay_ok_h')}</div><p class="p">${L('pay_ok_p')}</p>
      <div class="card" style="text-align:left;margin-top:16px;border-color:var(--accent)">
        <div class="flex between"><span class="note">${L('co_plan')}</span><b>${L(PLANS[pid].nameKey)}</b></div>
        <div class="flex between" style="margin-top:8px"><span class="note">${L('co_total')}</span><b>${priceStr(pid,APP.billing)}</b></div></div>
      <button class="btn full" style="margin-top:16px" onclick="APP.planStep='overview';go('inicio')">${L('pay_go')}</button></div>`;
  }
  if(APP.planStep==='checkout'){
    const pid=APP.checkoutPlan,c=APP.billing;
    return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;max-width:860px">
      <div class="card"><div class="section-label" style="margin:0 0 8px">${L('co_summary')}</div>
        <div class="flex between"><span class="note">${L('co_plan')}</span><b>${L(PLANS[pid].nameKey)}</b></div><div class="divider"></div>
        <div class="flex between"><span class="note">${L('co_cycle')}</span><b>${c==='yr'?L('bill_yr')+' · '+L('bill_save'):L('bill_mo')}</b></div><div class="divider"></div>
        <div class="flex between"><b>${L('co_total')}</b><span class="price" style="font-size:24px;font-weight:800;color:var(--brand)">${priceStr(pid,c)}</span></div>
        <p class="note" style="margin-top:8px">${c==='yr'?L('co_billed_yr'):L('co_billed_mo')}</p>
        <button class="btn gho" style="margin-top:6px;padding-left:0" onclick="APP.planStep='overview';render()">← ${L('co_back')}</button></div>
      <div class="card"><div class="section-label" style="margin:0 0 8px">${L('co_fast')}</div>
        <button class="paybtn apple" onclick="payPlan()"><svg width="14" height="17" viewBox="0 0 17 21" fill="#fff"><path d="M14.1 11.1c0-2 1.6-2.9 1.7-3-0.9-1.4-2.4-1.5-2.9-1.6-1.2-0.1-2.4 0.7-3 0.7-0.6 0-1.6-0.7-2.6-0.7-1.3 0-2.6 0.8-3.3 2-1.4 2.4-0.4 6 1 8 0.7 1 1.5 2.1 2.5 2 1-0.04 1.4-0.6 2.6-0.6 1.2 0 1.5 0.6 2.6 0.6 1.1 0 1.8-1 2.4-2 0.8-1.1 1.1-2.2 1.1-2.3 0-0.02-2.1-0.8-2.1-3.1zM12.2 5.2c0.5-0.6 0.9-1.5 0.8-2.4-0.8 0.03-1.7 0.5-2.2 1.2-0.5 0.6-0.9 1.5-0.8 2.3 0.9 0.07 1.7-0.5 2.2-1.1z"/></svg>Pay</button>
        <button class="paybtn google" onclick="payPlan()"><b><span style="color:#4285F4">G</span><span style="color:#EA4335">o</span><span style="color:#FBBC05">o</span><span style="color:#4285F4">g</span><span style="color:#34A853">l</span><span style="color:#EA4335">e</span></b> Pay</button>
        <div class="or-sep">${L('co_or')}</div>
        <input placeholder="${L('co_card_num')}" value="4242 4242 4242 4242"><div class="flex" style="gap:8px;margin-top:9px"><input placeholder="${L('co_exp')}" value="12 / 28"><input placeholder="${L('co_cvc')}" value="123"></div>
        <input style="margin-top:9px" placeholder="${L('co_name')}" value="${APP.userName}"><input style="margin-top:9px" placeholder="${L('co_email')}">
        <button class="btn full" style="margin-top:12px" onclick="payPlan()">${L('co_pay')} ${priceStr(pid,c)}</button>
        <div class="note" style="text-align:center;margin-top:10px">🔒 ${L('co_secure')}</div></div>
    </div>`;
  }
  // paywall / choose
  const c=APP.billing;
  const pcard=(pid,pop)=>`<div class="card" style="${pop?'border:2px solid var(--brand)':''}"><div class="flex between"><b>${L(PLANS[pid].nameKey)}</b>${pop?`<span class="tag g">${L('popular')}</span>`:''}</div>
    <div class="price" style="font-size:30px;font-weight:800;color:var(--brand);margin:8px 0">$${planPrice(pid,c)}<small style="font-size:14px;color:var(--muted);font-weight:600">${c==='yr'?L('yr'):L('mo')}</small></div>
    <p class="note">${L(PLANS[pid].featKey)}</p>
    <button class="btn ${pop?'':'sec'} full" style="margin-top:12px" onclick="goCheckout('${pid}')">${L('choose')}</button></div>`;
  return `<div style="max-width:760px">
    <div class="h">${L('cap_h')}</div><p class="p">${L('cap_p')}</p>
    <div class="seg" style="margin-top:10px"><div class="${c==='mo'?'on':''}" onclick="APP.billing='mo';render()">${L('bill_mo')}</div><div class="${c==='yr'?'on':''}" onclick="APP.billing='yr';render()">${L('bill_yr')} · ${L('bill_save')}</div></div>
    <div class="plan-grid">${pcard('plan1',false)}${pcard('plan5',true)}</div>
  </div>`;
};

V.ajustes=()=>{
  const sw=(on,act)=>`<span onclick="${act}" style="cursor:pointer;display:inline-flex;align-items:center;width:42px;height:24px;border-radius:20px;background:${on?'var(--brand)':'var(--line)'};position:relative;transition:.2s"><span style="position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:${on?'21px':'3px'};transition:.2s"></span></span>`;
  const planLabel=APP.plan==='free'?L('plan_free'):L(PLANS[APP.plan].nameKey);
  return `<div style="max-width:620px"><div class="h">${L('set_h')}</div>
    <div class="card" style="margin-top:12px;padding:6px 18px">
      <div class="flex between" style="padding:12px 0;border-bottom:1px solid var(--line)"><b style="font-size:13px">${L('set_theme')}</b>${sw(APP.dark,'toggleTheme()')}</div>
      <div class="flex between" style="padding:12px 0;border-bottom:1px solid var(--line)"><b style="font-size:13px">${L('set_lang')}</b>
        <select style="width:auto;background:none;border:none;color:var(--brand);font-weight:700;cursor:pointer" onchange="setLang(this.value)"><option value="es" ${APP.lang==='es'?'selected':''}>Español</option><option value="en" ${APP.lang==='en'?'selected':''}>English</option></select></div>
      <div class="flex between" style="padding:12px 0;border-bottom:1px solid var(--line)"><b style="font-size:13px">${L('set_notif')}</b>${sw(true,'this.firstElementChild&&0')}</div>
      <div class="flex between" style="padding:12px 0;border-bottom:1px solid var(--line)"><b style="font-size:13px">${L('set_tests')}</b><span class="note">C. Lectora, Mat M1 ›</span></div>
      <div class="flex between" style="padding:12px 0;cursor:pointer" onclick="go('plan')"><b style="font-size:13px">${L('set_plan')}</b><span class="note">${planLabel} ›</span></div>
    </div>
    <div class="card" style="margin-top:14px;cursor:pointer"><div class="flex between"><b style="font-size:13px">${L('set_privacy')}</b><span class="note">›</span></div></div>
    <div class="card" style="margin-top:14px;border-color:var(--danger);background:rgba(239,68,68,.05)"><b style="font-size:13px;color:var(--danger)">${L('set_danger')}</b><p class="note">${L('set_danger_p')}</p></div>
  </div>`;
};

V.tutores=()=>{
  const es=APP.lang==='es';const free=APP.plan==='free';const t=TUTORS[APP.tutSel]||TUTORS[0];const cn=tutCrit();
  const backMarket=`<span class="note" style="cursor:pointer;color:var(--brand);font-weight:700" onclick="tutGo('market')">‹ ${es?'Volver a tutores':'Back to tutors'}</span>`;
  const backProfile=`<span class="note" style="cursor:pointer;color:var(--brand);font-weight:700" onclick="tutGo('profile')">‹ ${es?'Volver al perfil':'Back to profile'}</span>`;

  // MARKETPLACE
  if(APP.tutStep==='market'){
    return `
    <div class="flex between" style="flex-wrap:wrap;gap:10px">
      <div><div class="h" style="font-size:22px">${es?'Tutores particulares':'Private tutors'} <span class="tag w">⭐ Premium</span></div><div class="sub">${es?'Encuentra al profesor ideal según tus áreas débiles.':'Find the right tutor for your weak areas.'}</div></div>
    </div>
    <div style="margin-top:14px;max-width:420px"><input type="text" placeholder="🔍 ${es?'Buscar profesor o asignatura…':'Search tutor or subject…'}"></div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">${APP.tests.map(tt=>`<span class="chip" style="cursor:pointer" onclick="this.classList.toggle('on')"><span style="width:8px;height:8px;border-radius:50%;background:${tt.color}"></span>${tt.label}</span>`).join('')}</div>
    ${free?`<div class="card flat" style="margin-top:14px;border-color:var(--brand);display:flex;align-items:center;gap:12px;cursor:pointer" onclick="go('plan')"><span style="font-size:20px">🔓</span><span class="note" style="flex:1;color:var(--ink);font-weight:600">${es?'Contactar tutores y el análisis de falencias requieren plan Premium.':'Contacting tutors and gap analysis require Premium.'}</span><span class="tag g">${es?'Mejorar ›':'Upgrade ›'}</span></div>`:''}
    <div class="dash" style="margin-top:16px">
      <div class="card span3" style="background:linear-gradient(135deg,var(--brand),#264b80);color:#fff;border:none;cursor:pointer" onclick="tutGo('analysis')">
        <div class="flex between" style="flex-wrap:wrap;gap:12px"><div class="flex" style="gap:14px"><span style="font-size:32px">🎯</span><div><div class="h" style="color:#fff">${es?'Análisis de falencias':'Gap analysis'}</div><p class="note" style="color:rgba(255,255,255,.8)">${es?'Detecta tus áreas débiles desde tu práctica PAES y recibe tutores recomendados.':'Spot weak areas from your PAES practice and get recommended tutors.'}</p></div></div><button class="btn" onclick="event.stopPropagation();tutGo('analysis')">${es?'Generar análisis →':'Generate analysis →'}</button></div>
      </div>
      ${TUTORS.map((tt,i)=>`
      <div class="card group-card" style="cursor:pointer" onclick="tutOpen(${i})">
        <div class="flex" style="gap:12px;align-items:flex-start">
          <div class="avatar-sq" style="background:${tt.c}">${tt.ini}</div>
          <div style="flex:1;min-width:0">
            <div class="flex between"><b style="font-size:15px;font-family:'Montserrat',sans-serif">${tt.name}</b>${tt.ver?`<span class="tag g">✔ ${es?'Verificado':'Verified'}</span>`:''}</div>
            <div class="note">${es?tt.subj:tt.subjEn} · ${es?tt.mode:tt.modeEn}</div>
            <div class="flex" style="gap:6px;margin-top:5px">${stars(tt.rate,13)}<span style="font-size:12px;font-weight:700;font-family:'Montserrat',sans-serif">${tt.rate}</span><span class="note">(${tt.nrev})</span></div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="flex between"><span><b style="font-size:16px;font-family:'Montserrat',sans-serif;color:var(--brand)">${tt.price}</b><span class="note"> / ${es?'hora':'hr'}</span></span><span class="note">${es?'Ver perfil ›':'View profile ›'}</span></div>
      </div>`).join('')}
    </div>`;
  }

  // ANÁLISIS DE FALENCIAS (premium · datos PAES)
  if(APP.tutStep==='analysis'){
    const fal=[
      {subj:es?'Matemática M1':'Math M1',col:'#10B981',m:58,weak:es?['Álgebra','Funciones']:['Algebra','Functions'],n:6},
      {subj:es?'Comp. Lectora':'Reading Comp.',col:'#1A365D',m:71,weak:es?['Inferencias']:['Inference'],n:4},
      {subj:es?'Ciencias':'Science',col:'#F5B041',m:44,weak:es?['Biología celular','Química']:['Cell biology','Chemistry'],n:5},
    ];
    return `<div style="max-width:880px">
      ${backMarket}
      <div class="h" style="font-size:20px;margin-top:10px">${es?'Análisis de falencias':'Gap analysis'} <span class="tag w">⭐ Premium</span></div>
      <div class="card flat" style="margin-top:12px;border:1px solid var(--brand)"><div class="flex" style="gap:12px"><span style="font-size:24px">📊</span><div><b>${es?'Tu diagnóstico PAES':'Your PAES diagnosis'}</b><p class="note">${es?'Basado en 342 ejercicios resueltos en Aprueba. Ordenado de mayor a menor necesidad.':'Based on 342 exercises solved in Aprueba. Sorted by need.'}</p></div></div></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:16px">
      ${fal.map(f=>`<div class="card"><div class="flex between"><b>${f.subj}</b><span class="tag ${f.m>=70?'g':'w'}">${f.m}% ${es?'dominio':'mastery'}</span></div><div class="bar"><i style="width:${f.m}%;background:${f.col}"></i></div><div class="note" style="margin-top:10px">${es?'Áreas a reforzar':'Areas to reinforce'}:</div><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${f.weak.map(w=>`<span class="tag w">⚠ ${w}</span>`).join('')}</div><button class="btn sec full" style="margin-top:12px" onclick="tutGo('market')">${es?`Ver ${f.n} tutores →`:`See ${f.n} tutors →`}</button></div>`).join('')}
      </div>
    </div>`;
  }

  // PERFIL DEL PROFESOR
  if(APP.tutStep==='profile'){
    return `<div>
      ${backMarket}
      <div style="display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start;margin-top:12px">
        <div class="card">
          <div class="flex" style="gap:14px;align-items:flex-start">
            <div class="avatar-sq" style="background:${t.c};width:56px;height:56px;font-size:20px">${t.ini}</div>
            <div style="flex:1"><div class="flex" style="gap:8px"><b style="font-size:18px;font-family:'Montserrat',sans-serif">${t.name}</b>${t.ver?`<span class="tag g">✔ ${es?'Verificado':'Verified'}</span>`:''}</div>
              <div class="note">${es?t.subj:t.subjEn} · ${es?t.mode:t.modeEn}</div>
              <div class="flex" style="gap:6px;margin-top:5px">${stars(t.rate,15)}<span style="font-weight:700;font-family:'Montserrat',sans-serif">${t.rate}</span><span class="note">(${t.nrev} ${es?'reseñas':'reviews'})</span></div>
            </div>
          </div>
          <p class="p" style="margin-top:14px">${es?t.bio:t.bioEn}</p>
          <div class="section-label">${es?'Valoración por criterio':'Rating by criterion'}</div>
          ${cn.map((c,i)=>`<div class="flex between" style="margin-top:8px"><span style="font-size:13px">${c}</span><span class="flex" style="gap:8px">${stars(t.crit[i],13)}<b style="font-family:'Montserrat',sans-serif;font-size:13px">${t.crit[i].toFixed(1)}</b></span></div>`).join('')}
          <div class="flex between" style="margin-top:18px"><div class="section-label" style="margin:0">${es?'Reseñas':'Reviews'}</div><span class="note" style="color:var(--brand);cursor:pointer;font-weight:700" onclick="tutGo('reviews')">${es?`Ver todas (${t.nrev}) →`:`See all (${t.nrev}) →`}</span></div>
          <div class="card flat" style="margin-top:10px"><div class="flex between"><div class="flex" style="gap:8px"><div class="mavatar" style="background:#10B981;margin:0">CR</div><b style="font-size:13px">Camila R.</b></div>${stars(5,12)}</div><p class="note" style="margin-top:8px">${es?'"Explica increíble, subí 120 puntos en el ensayo. Muy puntual."':'"Explains amazingly, my mock score went up 120 points. Very punctual."'}</p></div>
        </div>
        <div class="card" style="position:sticky;top:84px">
          <div class="flex between"><span><b style="font-size:24px;font-family:'Montserrat',sans-serif;color:var(--brand)">${t.price}</b><span class="note"> / ${es?'hora':'hr'}</span></span><span class="tag">🎓 ${t.exp} ${es?'años':'yrs'}</span></div>
          <button class="btn full" style="margin-top:14px" onclick="tutGo('contact')">${es?'Contactar':'Contact'}</button>
          <p class="note" style="text-align:center;margin-top:8px">⭐ ${es?'Requiere plan Premium':'Requires Premium plan'}</p>
          <div class="divider"></div>
          <div class="note">${es?'Modalidad':'Format'}: ${es?t.mode:t.modeEn}</div>
          <div class="note" style="margin-top:6px">💳 ${es?'El pago de clases se acuerda directamente con el profesor.':'Lesson payment is arranged directly with the tutor.'}</div>
        </div>
      </div>
    </div>`;
  }

  // TODAS LAS RESEÑAS
  if(APP.tutStep==='reviews'){
    const rv=[
      {ini:'CR',c:'#10B981',name:'Camila R.',date:es?'Hace 2 sem':'2 wk ago',ov:5,vals:[5,5,5],txt:es?'Explica increíble, subí 120 puntos. Muy puntual y paciente.':'Explains amazingly, +120 points. Punctual and patient.'},
      {ini:'TG',c:'#1A365D',name:'Tomás G.',date:es?'Hace 1 mes':'1 mo ago',ov:5,vals:[5,4,5],txt:es?'Domina la materia. A veces se atrasaba unos minutos.':'Masters the subject. Sometimes a few minutes late.'},
      {ini:'AM',c:'#6366F1',name:'Andrea M.',date:es?'Hace 1 mes':'1 mo ago',ov:4,vals:[4,5,4],txt:es?'Buena profe, me habría gustado más material de práctica.':'Good tutor, wish there were more practice material.'},
    ];
    return `<div style="max-width:760px">
      ${backProfile}
      <div class="card" style="margin-top:12px;text-align:center"><div style="font-size:34px;font-weight:800;font-family:'Montserrat',sans-serif;color:var(--brand)">${t.rate}</div>${stars(t.rate,18)}<div class="note" style="margin-top:6px">${t.nrev} ${es?'reseñas verificadas · '+t.name:'verified reviews · '+t.name}</div></div>
      <div class="section-label">${es?'Promedio por criterio':'Average by criterion'}</div>
      ${cn.map((c,i)=>`<div class="flex between" style="margin-top:8px"><span style="font-size:13px">${c}</span><span class="flex" style="gap:8px">${stars(t.crit[i],13)}<b style="font-family:'Montserrat',sans-serif;font-size:13px">${t.crit[i].toFixed(1)}</b></span></div>`).join('')}
      <div class="section-label">${es?'Opiniones':'Opinions'}</div>
      ${rv.map(r=>`<div class="card" style="margin-top:10px"><div class="flex between"><div class="flex" style="gap:8px"><div class="mavatar" style="background:${r.c};margin:0">${r.ini}</div><div><b style="font-size:13px">${r.name}</b><div class="note">${r.date}</div></div></div>${stars(r.ov,13)}</div><div class="flex" style="gap:14px;margin-top:8px;flex-wrap:wrap">${cn.map((c,i)=>`<span class="note">${c.split(' ')[0]}: <b>${r.vals[i]}</b></span>`).join('')}</div><p class="p" style="margin-top:6px">"${r.txt}"</p></div>`).join('')}
    </div>`;
  }

  // CONTACTAR / SOLICITUD (premium)
  if(APP.tutStep==='contact'){
    return `<div style="max-width:680px">
      ${backProfile}
      <div class="h" style="font-size:20px;margin-top:10px">${es?'Contactar a '+t.name:'Contact '+t.name} <span class="tag w">⭐ Premium</span></div>
      <p class="p">${es?t.name+' recibirá tu perfil para conocer tus necesidades antes de responder.':t.name+' will receive your profile to understand your needs before replying.'}</p>
      <div class="section-label">${es?'Tu perfil (se compartirá)':'Your profile (will be shared)'}</div>
      <div class="card"><div class="flex" style="gap:12px"><div class="avatar-sq" style="background:var(--cta);color:#1A365D">${(APP.userName[0]||'E')}</div><div><b>${APP.userName} · ${es?'4º Medio':'12th grade'}</b><div class="note">${es?'Objetivo: 700+ pts · Rinde PAES nov. 2026':'Goal: 700+ pts · PAES Nov 2026'}</div></div></div>
        <div class="note" style="margin-top:12px">${es?'Áreas débiles (de tu análisis)':'Weak areas (from your analysis)'}:</div>
        <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${(es?['Álgebra','Funciones']:['Algebra','Functions']).map(w=>`<span class="tag w">⚠ ${w}</span>`).join('')}</div>
      </div>
      <div class="section-label">${es?'Mensaje':'Message'}</div>
      <textarea placeholder="${es?'Hola '+t.name+', necesito reforzar álgebra para la PAES. ¿Tienes cupos en las tardes?':'Hi '+t.name+', I need to reinforce algebra for the PAES. Any afternoon slots?'}"></textarea>
      <p class="note" style="margin-top:8px">💳 ${es?'El pago de clases se acuerda directamente con el profesor (pronto integrado en Aprueba).':'Lesson payment is arranged directly with the tutor (coming soon in Aprueba).'}</p>
      <button class="btn full" style="margin-top:14px" onclick="tutGo('chat')">${es?'Enviar solicitud':'Send request'}</button>
    </div>`;
  }

  // CHAT INTERNO (+ compartir contacto)
  if(APP.tutStep==='chat'){
    const msgs=[
      {me:false,x:es?'¡Hola '+APP.userName+'! Vi tu perfil, podemos partir reforzando álgebra. Tengo cupo martes y jueves 18:00.':'Hi '+APP.userName+'! Saw your profile, we can start with algebra. I have Tue & Thu 6pm slots.'},
      {me:true,x:es?'Perfecto, me sirve el martes. ¿Es online?':'Great, Tuesday works. Is it online?'},
      {me:false,x:es?'Sí, por videollamada. La primera clase es de diagnóstico 👍':'Yes, by video call. First class is a diagnosis 👍'},
    ];
    return `<div style="max-width:680px">
      <div class="flex between"><div class="flex" style="gap:10px"><span class="note" style="cursor:pointer;color:var(--brand);font-weight:700;font-size:18px" onclick="tutGo('profile')">‹</span><div class="avatar-sq" style="background:${t.c};width:40px;height:40px;font-size:15px">${t.ini}</div><div><b>${t.name}</b><div class="note" style="color:var(--accent);font-weight:600">● ${es?'En línea':'Online'}</div></div></div></div>
      <div class="card flat" style="margin-top:12px;border:1px solid var(--cta);background:rgba(245,176,65,.1)"><div class="flex between"><b style="font-size:13px">🔒 ${es?'Compartir mi WhatsApp':'Share my WhatsApp'}</b><div class="seg"><div class="on">${es?'Sí':'On'}</div><div>${es?'No':'Off'}</div></div></div><p class="note" style="margin-top:6px">${es?'Se revela solo si ambos aceptan. Recomendamos coordinar aquí primero.':'Revealed only if both agree. We suggest coordinating here first.'}</p></div>
      <div style="margin-top:14px;display:flex;flex-direction:column;gap:10px">${msgs.map(m=>`<div style="max-width:75%;align-self:${m.me?'flex-end':'flex-start'};background:${m.me?'var(--brand)':'var(--soft)'};color:${m.me?'#fff':'var(--ink)'};border:1px solid ${m.me?'var(--brand)':'var(--line)'};border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.45">${m.x}</div>`).join('')}</div>
      <div class="flex" style="gap:10px;margin-top:14px"><input type="text" placeholder="${es?'Escribe un mensaje…':'Type a message…'}"><button class="btn">➤</button></div>
      <button class="btn sec full" style="margin-top:10px" onclick="tutGo('review')">⭐ ${es?'Calificar a '+t.name:'Rate '+t.name}</button>
    </div>`;
  }

  // DEJAR RESEÑA (1–5 ⭐ · 3 criterios)
  if(APP.tutStep==='review'){
    return `<div style="max-width:680px">
      <span class="note" style="cursor:pointer;color:var(--brand);font-weight:700" onclick="tutGo('chat')">‹ ${es?'Volver al chat':'Back to chat'}</span>
      <div class="h" style="font-size:20px;margin-top:10px">${es?'Calificar profesor':'Rate tutor'}</div>
      <div class="flex" style="gap:12px;margin-top:8px"><div class="avatar-sq" style="background:${t.c}">${t.ini}</div><div><b>${t.name}</b><div class="note">${es?'8 clases tomadas · '+t.subj:'8 classes taken · '+t.subjEn}</div></div></div>
      <p class="p" style="margin-top:10px">${es?'Califica de 1 a 5 estrellas cada criterio:':'Rate each criterion from 1 to 5 stars:'}</p>
      ${cn.map(c=>`<div class="card" style="margin-top:10px"><b style="font-size:14px">${c}</b><div style="margin-top:8px">${starPick()}</div></div>`).join('')}
      <div class="section-label">${es?'Comentario (opcional)':'Comment (optional)'}</div>
      <textarea placeholder="${es?'Cuenta tu experiencia para ayudar a otros alumnos…':'Share your experience to help other students…'}"></textarea>
      <button class="btn full" style="margin-top:14px" onclick="tutGo('profile')">${es?'Publicar reseña':'Publish review'}</button>
    </div>`;
  }
  return '';
};

// ── actions ──
function selectOpt(i){document.querySelectorAll('.opt').forEach((o,j)=>o.className='opt'+(j===i?' sel':''));APP.selectedOpt=i;}
function checkAnswer(){if(APP.selectedOpt===null)return;APP.practiceStep='result';render();}
function doExchange(from,to){if((APP.medals[from]||0)<5)return;APP.medals[from]-=5;APP.medals[to]=(APP.medals[to]||0)+1;render();}
function goCheckout(pid){APP.checkoutPlan=pid;APP.planStep='checkout';render();}
function payPlan(){APP.plan=APP.checkoutPlan;APP.planCancelled=false;APP.planStep='success';APP.quotaMax=9999;render();}

// ── render / nav ──
function go(view){APP.view=view;if(view==='practicar')APP.practiceStep='q',APP.selectedOpt=null;if(view==='plan'&&APP.plan==='free')APP.planStep='overview';if(view!=='grupos')APP.openGroup=null;if(view==='tutores')APP.tutStep='market';toggleSidebar(false);render();}
function toggleSidebar(open){document.getElementById('sidebar').classList.toggle('open',open);document.getElementById('scrim').classList.toggle('open',open);}
function setLang(l){APP.lang=l;document.getElementById('langSel').value=l;document.documentElement.lang=l;render();}
function toggleTheme(){APP.dark=!APP.dark;document.body.classList.toggle('dark',APP.dark);document.getElementById('themeBtn').textContent=APP.dark?'☀️':'🌙';render();}

function renderNav(){
  document.getElementById('nav').innerHTML=
    `<div class="nav-sec">${L('nav_main')}</div>`+
    NAV.slice(0,6).map(([id,ic])=>navItem(id,ic)).join('')+
    `<div class="nav-sec">${L('nav_account')}</div>`+
    NAV.slice(6).map(([id,ic])=>navItem(id,ic)).join('');
}
function navItem(id,ic){
  const badge=(id==='plan'&&APP.plan==='free')?`<span class="badge">PRO</span>`:'';
  return `<div class="nav-item ${APP.view===id?'act':''}" onclick="go('${id}')"><span class="ico">${ic}</span>${L('nav_'+id)}${badge}</div>`;
}
function render(){
  renderNav();
  document.getElementById('pageTitle').textContent=L('nav_'+APP.view);
  document.getElementById('searchInp').placeholder=L('search_ph');
  document.getElementById('streakChip').textContent='🔥 '+APP.streak;
  document.getElementById('userName').textContent=APP.userName;
  document.getElementById('userInitial').textContent=APP.userName[0]||'E';
  document.getElementById('userPlan').textContent=APP.plan==='free'?L('plan_free'):L(PLANS[APP.plan].nameKey);
  document.getElementById('main').innerHTML=(V[APP.view]||V.inicio)();
}
render();
</script>
</body>
</html>
