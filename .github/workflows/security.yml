name: Aprueba security and regression checks
on:
  push:
    branches: [main]
    paths: ['Fase 2/Evidencias Proyecto/Evidencias de sistema Aplicacion/**', '.github/**']
  pull_request:
    paths: ['Fase 2/Evidencias Proyecto/Evidencias de sistema Aplicacion/**', '.github/**']
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [aprueba_api, aprueba_student_web]
    defaults:
      run:
        working-directory: Fase 2/Evidencias Proyecto/Evidencias de sistema Aplicacion/${{ matrix.component }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm test
      - if: matrix.component == 'aprueba_student_web'
        run: npm run lint && npm run build
  authorization:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Fase 2/Evidencias Proyecto/Evidencias de sistema Aplicacion/aprueba_api
    env:
      SECURITY_TEST_PROJECT_ID: demo-aprueba-ci
      ACCOUNT_DELETION_TEST_PROJECT_ID: demo-aprueba-ci
      PARITY_TEST_PROJECT_ID: demo-aprueba-ci
      PAYPAL_TEST_PROJECT_ID: demo-aprueba-ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - name: Isolated authorization, deletion and shared-contract tests
        run: npx --yes firebase-tools@15.31.0 emulators:exec --project demo-aprueba-ci --only auth,firestore --config ../database/firebase.json "npm run test:security:emulator && npm run test:account-deletion:emulator && npm run test:parity:emulator && npm run test:paypal:emulator"
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Fase 2/Evidencias Proyecto/Evidencias de sistema Aplicacion/aprueba_app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
